<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: shell(#{meta.repositoryGit.title}, #{meta.repositoryGit.description}, ${currentLocale}, ${localeLinks}, ${currentLocaleLabel}, ${currentLocaleCode}, ${currentLocaleFlagPath}, ${loginPath}, 'page-repository page-repository--git', ~{::content})}">
<th:block th:fragment="content">
    <section class="repo_stage">
        <div class="repo_stack repo_stack--page">
            <section class="repository_workspace repository_workspace--page"
                     data-repository-live>
                <div data-repository-bootstrap hidden>{}</div>

                <div class="repository_compactbar">
                    <div class="repository_switch repository_switch--page">
                        <a class="repository_switch__button"
                           th:href="${repositoryPlaywrightPath}">
                            <img class="repository_switch__icon"
                                 src="https://assets.streamlinehq.com/image/private/w_300,h_300,ar_1/f_auto/v1/icons/2/playwright-y50bnthygb3rvsppvkm9e.png/playwright-q55xzpenhgjsodksybst.png?_a=DATAiZAAZAA0"
                                 alt=""
                                 aria-hidden="true">
                            <span th:text="#{repository.playwright.label}">repository.playwright.label</span>
                        </a>
                        <a class="repository_switch__button repository_switch__button--active"
                           th:href="${repositoryGitPath}">
                            <img class="repository_switch__icon"
                                 src="https://www.linux-magazin.de/wp-content/uploads/2026/02/Git-Icon-1788C.png"
                                 alt=""
                                 aria-hidden="true">
                            <span th:text="#{repository.git.label}">repository.git.label</span>
                        </a>
                        <a class="repository_switch__button"
                           th:href="${repositoryBoardPath}"
                           th:text="#{repository.board.label}">repository.board.label</a>
                        <button class="repository_switch__refresh"
                                type="button"
                                @click="triggerRepositoryRefresh()"
                                :disabled="repositoryRefreshing || repositoryLoading"
                                :aria-busy="String(repositoryRefreshing || repositoryLoading)"
                                :class="{ 'repository_switch__refresh--loading': repositoryRefreshing || repositoryLoading }"
                                th:attr="aria-label=#{repository.refresh}">
                            <span class="repository_switch__refresh-label"
                                  th:text="#{repository.refresh}">repository.refresh</span>
                            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                                <path d="M20 12a8 8 0 1 1-2.34-5.66"></path>
                                <path d="M20 4v6h-6"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="git_metrics">
                    <article class="git_metric">
                        <span class="git_metric__value"
                              v-text="animatedMetrics.git.totalCommits"></span>
                        <span class="git_metric__label" th:text="#{repository.git.commits}">repository.git.commits</span>
                    </article>
                    <article class="git_metric">
                        <span class="git_metric__value"
                              v-text="animatedMetrics.git.mergeCommits"></span>
                        <span class="git_metric__label" th:text="#{repository.git.merges}">repository.git.merges</span>
                    </article>
                    <article class="git_metric">
                        <span class="git_metric__value"
                              v-text="animatedMetrics.git.contributorCount"></span>
                        <span class="git_metric__label" th:text="#{repository.git.contributors}">repository.git.contributors</span>
                    </article>
                    <article class="git_metric">
                        <span class="git_metric__value"
                              v-text="animatedMetrics.git.branchCount"></span>
                        <span class="git_metric__label" th:text="#{repository.git.branches}">repository.git.branches</span>
                    </article>
                </div>

                <div class="repository_segmented repository_segmented--git"
                     data-segmented="gitView"
                     data-active="activity">
                    <button class="repository_segmented__button"
                            type="button"
                            data-segmented-value="activity"
                            @click="setSegment('gitView', 'activity')"
                            th:text="#{repository.git.activity}">repository.git.activity</button>
                    <button class="repository_segmented__button"
                            type="button"
                            data-segmented-value="graph"
                            @click="setSegment('gitView', 'graph')"
                            th:text="#{repository.git.timeline}">repository.git.timeline</button>
                    <span class="repository_segmented__indicator" aria-hidden="true"></span>
                </div>

                <div class="repository_stage repository_stage--git">
                    <div v-if="repositoryLoading" class="repository_live_loading" role="status" aria-live="polite">
                        <span class="repository_live_loading__dots" aria-hidden="true">
                            <span class="repository_live_loading__dot"></span>
                            <span class="repository_live_loading__dot"></span>
                            <span class="repository_live_loading__dot"></span>
                        </span>
                        <p class="repository_live_loading__text"
                           th:text="#{repository.liveLoading}">repository.liveLoading</p>
                    </div>

                    <section v-show="gitView === 'graph'"
                             v-if="!repositoryLoading"
                             data-segment-panel="gitView"
                             data-segment-value="graph"
                             class="repository_surface repository_surface--graph">
                        <div class="git_graph_workspace">
                            <div class="git_graph_workspace__body">
                                <div class="git_graph_canvas_panel">
                                    <div class="git_graph_canvas" data-gitgraph-container></div>
                                    <div class="git_graph_branch_labels" data-git-branch-labels></div>
                                    <div class="git_graph_tooltip"
                                         :class="{ 'git_graph_tooltip--visible': gitGraphTooltip.visible }"
                                         :style="{
                                             '--tooltip-x': gitGraphTooltip.x + 'px',
                                             '--tooltip-y': gitGraphTooltip.y + 'px',
                                             '--tooltip-source-x': gitGraphTooltip.sourceX + 'px',
                                             '--tooltip-source-y': gitGraphTooltip.sourceY + 'px',
                                             '--tooltip-anchor-x': gitGraphTooltip.anchorX + 'px'
                                         }"
                                         role="status"
                                         aria-live="polite">
                                        <p class="git_graph_tooltip__meta">
                                            <span class="git_graph_tooltip__sha" v-text="gitGraphTooltip.shortSha"></span>
                                            <span v-if="gitGraphTooltip.dateLabel" v-text="gitGraphTooltip.dateLabel"></span>
                                        </p>
                                        <p class="git_graph_tooltip__title" v-text="gitGraphTooltip.subject"></p>
                                        <p class="git_graph_tooltip__detail" v-if="gitGraphTooltip.author || gitGraphTooltip.mergeInfo">
                                            <span class="git_graph_tooltip__author" v-if="gitGraphTooltip.author">
                                                <span class="git_graph_tooltip__avatar">
                                                    <img v-if="gitGraphTooltip.authorAvatarUrl"
                                                         class="repo_avatar__image"
                                                         :src="gitGraphTooltip.authorAvatarUrl"
                                                         :alt="gitGraphTooltip.author">
                                                    <span v-else
                                                          class="repo_avatar__fallback"
                                                          v-text="gitGraphTooltip.authorInitials || gitGraphTooltip.author.slice(0, 2)"></span>
                                                </span>
                                                <span v-text="gitGraphTooltip.author"></span>
                                            </span>
                                            <span v-if="gitGraphTooltip.author && gitGraphTooltip.mergeInfo">·</span>
                                            <span v-if="gitGraphTooltip.mergeInfo" v-text="gitGraphTooltip.mergeInfo"></span>
                                        </p>
                                    </div>
                                </div>

                                <aside class="git_graph_feed">
                                    <div class="git_graph_feed__header">
                                        <span class="git_panel__eyebrow" th:text="#{repository.git.recent}">repository.git.recent</span>
                                    </div>

                                    <ol class="git_graph_feed__list">
                                        <li v-for="commit in currentProjectGraph.recentCommits" :key="commit.hash">
                                            <article class="git_graph__card"
                                                     :class="{
                                                         'git_graph__card--active': commit.hash === selectedGitCommitHash,
                                                         'git_graph__card--hover': commit.hash === hoveredGitCommitHash
                                                     }"
                                                     :data-recent-commit-hash="commit.hash"
                                                     role="button"
                                                     tabindex="0"
                                                     @click="selectGitCommitFromFeed(commit.hash, $event)"
                                                     @keydown.enter.prevent="selectGitCommitFromFeed(commit.hash)"
                                                     @keydown.space.prevent="selectGitCommitFromFeed(commit.hash)">
                                                <div class="git_graph__topline">
                                                    <span class="git_commit__sha" v-text="commit.shortSha"></span>
                                                    <span class="git_commit__date" v-text="commit.dateLabel"></span>
                                                </div>
                                                <p class="git_commit__message" v-text="commit.message"></p>
                                                <div class="git_commit__meta">
                                                    <a v-if="commit.profileUrl"
                                                       class="repo_avatar repo_avatar--link"
                                                       :href="commit.profileUrl"
                                                       target="_blank"
                                                       rel="noreferrer"
                                                       :title="commit.author">
                                                        <img v-if="commit.avatarUrl"
                                                             class="repo_avatar__image"
                                                             :src="commit.avatarUrl"
                                                             :alt="commit.author">
                                                        <span v-else
                                                              class="repo_avatar__fallback"
                                                              v-text="commit.initials"></span>
                                                    </a>
                                                    <span v-else class="repo_avatar" :title="commit.author">
                                                        <img v-if="commit.avatarUrl"
                                                             class="repo_avatar__image"
                                                             :src="commit.avatarUrl"
                                                             :alt="commit.author">
                                                        <span v-else
                                                              class="repo_avatar__fallback"
                                                              v-text="commit.initials"></span>
                                                    </span>
                                                    <span class="git_commit__author" v-text="commit.author"></span>
                                                </div>
                                            </article>
                                        </li>
                                    </ol>
                                </aside>
                            </div>
                        </div>
                    </section>

                    <section v-show="gitView === 'activity'"
                             v-if="!repositoryLoading"
                             data-segment-panel="gitView"
                             data-segment-value="activity"
                             class="repository_surface repository_surface--activity">
                        <div class="git_activity_surface">
                            <div class="git_activity_surface__toolbar">
                                <span class="git_stage__date"
                                      v-text="repository.git.lastCommitLabel"></span>

                                <details class="repo_menu repo_menu--inline repo_menu--surface">
                                    <summary class="repo_menu__summary repo_menu__summary--surface">
                                        <span class="repo_menu__label"
                                              v-text="currentActivityRangeLabel"></span>
                                        <span class="repo_menu__chevron" aria-hidden="true">
                                            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                                                <path d="M6 9l6 6 6-6"></path>
                                            </svg>
                                        </span>
                                    </summary>

                                    <div class="repo_menu__panel repo_menu__panel--surface">
                                        <button type="button"
                                                class="repo_menu__item repo_menu__item--button"
                                                :class="{ 'repo_menu__item--active': gitActivityRange === 'week' }"
                                                @click="selectGitActivityRange('week', $event)"
                                                v-text="repository.git.activityRanges.week"></button>
                                        <button type="button"
                                                class="repo_menu__item repo_menu__item--button"
                                                :class="{ 'repo_menu__item--active': gitActivityRange === 'month' }"
                                                @click="selectGitActivityRange('month', $event)"
                                                v-text="repository.git.activityRanges.month"></button>
                                        <button type="button"
                                                class="repo_menu__item repo_menu__item--button"
                                                :class="{ 'repo_menu__item--active': gitActivityRange === 'year' }"
                                                @click="selectGitActivityRange('year', $event)"
                                                v-text="repository.git.activityRanges.year"></button>
                                    </div>
                                </details>
                            </div>

                            <div class="git_activity git_activity--full"
                                 :style="{ '--activity-count': currentActivityBars.length }">
                                <article class="git_activity__day"
                                         v-for="day in currentActivityBars"
                                         :key="gitActivityRange + '-' + day.key"
                                         :title="day.fullLabel"
                                         data-activity-day>
                                    <span class="git_activity__count" v-text="day.count"></span>
                                    <span class="git_activity__bar"
                                          :class="{ 'git_activity__bar--zero': day.count === 0 }"
                                          :style="day.style"></span>
                                    <span class="git_activity__label"
                                          :class="{ 'git_activity__label--muted': gitActivityRange !== 'week' && !day.emphasizeLabel }"
                                          v-text="day.label"></span>
                                </article>
                            </div>
                        </div>

                        <div class="git_authors git_authors--grid">
                            <article class="git_author" v-for="author in repository.git.authors" :key="author.login">
                                <a v-if="author.profileUrl"
                                   class="repo_avatar repo_avatar--link"
                                   :href="author.profileUrl"
                                   target="_blank"
                                   rel="noreferrer"
                                   :title="author.name">
                                    <img v-if="author.avatarUrl"
                                         class="repo_avatar__image"
                                         :src="author.avatarUrl"
                                         :alt="author.name">
                                    <span v-else class="repo_avatar__fallback" v-text="author.initials"></span>
                                </a>
                                <span v-else class="repo_avatar" :title="author.name">
                                    <img v-if="author.avatarUrl"
                                         class="repo_avatar__image"
                                         :src="author.avatarUrl"
                                         :alt="author.name">
                                    <span v-else class="repo_avatar__fallback" v-text="author.initials"></span>
                                </span>

                                <div class="git_author__meta">
                                    <div class="git_author__line">
                                        <span class="git_author__name" v-text="author.name"></span>
                                        <span class="git_author__count"
                                              v-text="author.count + ' Commits | ' + (author.linesContributed ?? 0) + ' Zeilen beigetragen'"></span>
                                    </div>
                                    <span class="git_author__bar" :style="author.toneStyle"></span>
                                </div>
                            </article>
                        </div>
                    </section>
                </div>

                <teleport to="body">
                    <div v-if="activeGitCommit"
                         class="repo_modal"
                         role="dialog"
                         aria-modal="true"
                         @click.self="closeRepositoryModal()">
                        <article class="repo_modal__surface repo_modal__surface--commit">
                            <button class="repo_modal__close"
                                    type="button"
                                    th:attr="aria-label=#{nav.close}"
                                    @click="closeRepositoryModal()">
                                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                                    <path d="M6 6l12 12M18 6L6 18"></path>
                                </svg>
                            </button>

                            <div class="repo_modal__scroll">
                                <header class="repo_modal__header">
                                    <div class="board_card__topline">
                                        <span class="board_card__number" v-text="activeGitCommit.shortSha"></span>
                                        <span class="board_card__state" v-text="activeGitCommit.dateLabel"></span>
                                    </div>

                                    <h2 class="repo_modal__title" v-text="activeGitCommit.message"></h2>

                                    <div class="repo_modal__gitline">
                                        <span class="repo_modal__hash" v-text="activeGitCommit.hash"></span>
                                    </div>

                                    <div class="git_commit__meta">
                                        <a v-if="activeGitCommit.profileUrl"
                                           class="repo_avatar repo_avatar--link"
                                           :href="activeGitCommit.profileUrl"
                                           target="_blank"
                                           rel="noreferrer"
                                           :title="activeGitCommit.author">
                                            <img v-if="activeGitCommit.avatarUrl"
                                                 class="repo_avatar__image"
                                                 :src="activeGitCommit.avatarUrl"
                                                 :alt="activeGitCommit.author">
                                            <span v-else class="repo_avatar__fallback" v-text="activeGitCommit.initials"></span>
                                        </a>
                                        <span v-else class="repo_avatar" :title="activeGitCommit.author">
                                            <img v-if="activeGitCommit.avatarUrl"
                                                 class="repo_avatar__image"
                                                 :src="activeGitCommit.avatarUrl"
                                                 :alt="activeGitCommit.author">
                                            <span v-else class="repo_avatar__fallback" v-text="activeGitCommit.initials"></span>
                                        </span>
                                        <span class="git_commit__author" v-text="activeGitCommit.author"></span>
                                    </div>
                                </header>

                                <div v-if="activeGitCommitRefs.length" class="repo_modal__labels">
                                    <span class="board_card__label"
                                          v-for="ref in activeGitCommitRefs"
                                          :key="activeGitCommit.hash + '-ref-' + ref"
                                          v-text="ref"></span>
                                </div>

                                <div v-if="activeGitCommitParents.length" class="repo_modal__section">
                                    <ul class="board_card__list">
                                        <li class="board_card__list-item board_card__list-item--code"
                                            v-for="parent in activeGitCommitParents"
                                            :key="activeGitCommit.hash + '-parent-' + parent"
                                            v-text="parent"></li>
                                    </ul>
                                </div>
                            </div>

                            <footer class="repo_modal__footer">
                                <a v-if="activeGitCommitUrl"
                                   class="repo_modal__github"
                                   :href="activeGitCommitUrl"
                                   target="_blank"
                                   rel="noreferrer">
                                    <img class="repo_modal__github-icon repo_menu__icon"
                                         src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg"
                                         alt=""
                                         aria-hidden="true">
                                    <span th:text="#{nav.repository}">nav.repository</span>
                                </a>
                            </footer>
                        </article>
                    </div>
                </teleport>
            </section>
        </div>
    </section>
</th:block>
</html>
