<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: shell(#{meta.login.title}, #{meta.login.description}, ${currentLocale}, ${localeLinks}, ${currentLocaleLabel}, ${currentLocaleCode}, ${currentLocaleFlagPath}, ${loginPath}, 'page-auth', ~{::content})}">
<th:block th:fragment="content">
    <section class="auth_layout">
        <div class="auth_shell">
            <section class="auth_intro">
                <div>
                    <p class="auth_intro__eyebrow" th:text="#{auth.shared.eyebrow}">auth.shared.eyebrow</p>
                    <h2 class="auth_intro__title" th:text="#{auth.shared.title}">auth.shared.title</h2>
                    <p class="auth_intro__text" th:text="#{auth.shared.text}">auth.shared.text</p>
                </div>
                <ul class="auth_intro__list">
                    <li class="auth_intro__item" th:text="#{auth.shared.point.one}">auth.shared.point.one</li>
                    <li class="auth_intro__item" th:text="#{auth.shared.point.two}">auth.shared.point.two</li>
                    <li class="auth_intro__item" th:text="#{auth.shared.point.three}">auth.shared.point.three</li>
                </ul>
            </section>

            <section class="auth_card">
                <div class="auth_card__header">
                    <p class="auth_card__eyebrow" th:text="#{brand.name}">brand.name</p>
                    <h1 class="auth_card__title" th:text="#{auth.login.title}">auth.login.title</h1>
                    <p class="auth_card__text" th:text="#{auth.login.text}">auth.login.text</p>
                </div>

                <form class="auth_form" novalidate>
                    <label class="auth_field">
                        <span class="auth_field__label" th:text="#{auth.login.email}">auth.login.email</span>
                        <input class="auth_input"
                               type="email"
                               autocomplete="email"
                               placeholder="auth.login.emailPlaceholder"
                               th:attr="placeholder=#{auth.login.emailPlaceholder}">
                    </label>
                    <label class="auth_field">
                        <span class="auth_field__label" th:text="#{auth.login.password}">auth.login.password</span>
                        <input class="auth_input"
                               type="password"
                               autocomplete="current-password"
                               placeholder="auth.login.passwordPlaceholder"
                               th:attr="placeholder=#{auth.login.passwordPlaceholder}">
                    </label>
                    <button class="button button--primary auth_submit" type="button" th:text="#{auth.login.submit}">auth.login.submit</button>
                </form>

                <div class="auth_link_card">
                    <div>
                        <p class="auth_link_card__eyebrow" th:text="#{auth.login.alt.eyebrow}">auth.login.alt.eyebrow</p>
                        <h2 class="auth_link_card__title" th:text="#{auth.login.alt.title}">auth.login.alt.title</h2>
                        <p class="auth_link_card__text" th:text="#{auth.login.alt.text}">auth.login.alt.text</p>
                    </div>
                    <a class="button button--secondary auth_link_card__action" th:href="${registerPath}" th:text="#{auth.login.alt.cta}">auth.login.alt.cta</a>
                </div>
            </section>
        </div>
    </section>
</th:block>
</html>
