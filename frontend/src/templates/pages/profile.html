<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: shell(#{meta.profile.title}, #{meta.profile.description}, ${currentLocale}, ${localeLinks}, ${currentLocaleLabel}, ${currentLocaleCode}, ${currentLocaleFlagPath}, 'page-profile', ~{::content})}">
<th:block th:fragment="content">
    <section class="profile_page"
             data-profile-view
             th:attr="data-profile-loading-label=#{profile.page.loading},
                      data-profile-auth-required=#{profile.page.authRequired},
                      data-profile-not-found=#{profile.page.notFound},
                      data-profile-load-failed=#{profile.page.loadFailed},
                      data-profile-route-missing=#{profile.page.routeMissing},
                      data-profile-role-pet-owner=#{auth.register.rolePetOwner},
                      data-profile-role-host=#{auth.register.roleHost},
                      data-profile-host-from-template=#{profile.page.role.hostFromTemplate},
                      data-profile-pet-owner-from-template=#{profile.page.role.petOwnerFromTemplate},
                      data-profile-host-country-flag-path=#{profile.page.role.hostCountryFlagPath},
                      data-profile-host-country-flag=#{profile.page.role.hostCountryFlag},
                      data-profile-host-city-fallback=#{profile.page.role.hostCityFallback},
                      data-profile-rating-heading-template=#{profile.page.rating.headingTemplate},
                      data-profile-rating-aria-template=#{profile.page.rating.ariaTemplate},
                      data-profile-rating-first-name-fallback=#{profile.page.rating.firstNameFallback}">
        <header class="profile_hero">
            <div class="profile_hero__media">
                <img class="profile_hero__banner"
                     src="https://www.tierheime-helfen.de/fileadmin/user_upload/Dank.jpg"
                     th:attr="alt=#{profile.page.bannerAlt}"
                     alt="profile.page.bannerAlt">
                <div class="profile_hero__scrim" aria-hidden="true"></div>
            </div>
            <div class="profile_hero__avatar_ring">
                <img v-if="profileViewUser && profileViewUser.profilePicture"
                     class="profile_hero__avatar"
                     :src="profileViewUser.profilePicture"
                     :alt="profileViewDisplayName"
                     @error="handleProfileAvatarError">
                <span v-else class="profile_hero__avatar profile_hero__avatar--fallback" v-text="profileViewInitial"></span>
            </div>
        </header>

        <article class="profile_panel">
            <div v-if="profileViewLoading && showProfileViewLoadingDots"
                 class="profile_state profile_state--loading profile_state--loading-dots"
                 role="status"
                 aria-live="polite">
                <span class="repository_live_loading__dots" aria-hidden="true">
                    <span class="repository_live_loading__dot"></span>
                    <span class="repository_live_loading__dot"></span>
                    <span class="repository_live_loading__dot"></span>
                </span>
                <span class="repository_live_loading__text" v-text="profileStrings.loading"></span>
            </div>

            <p v-else-if="profileViewLoading"
               class="profile_state profile_state--loading"
               role="status"
               aria-live="polite"
               v-text="profileStrings.loading"></p>

            <p v-else-if="profileViewError"
               class="profile_state profile_state--error"
               role="alert"
               v-text="profileViewError"></p>

            <div v-else-if="profileViewUser" class="profile_panel__content">
                <h2 class="profile_panel__name" v-text="profileViewDisplayName"></h2>
                <p class="profile_panel__role">
                    <template v-if="profileViewRoleParts.showFlaggedCity">
                        <span v-if="profileViewRoleParts.prefix" v-text="profileViewRoleParts.prefix"></span>
                        <span v-if="profileViewRoleParts.prefix">&nbsp;</span>
                        <span class="profile_role_city">
                            <img class="profile_role_city__flag"
                                 :src="profileViewRoleParts.flagPath"
                                 alt=""
                                 aria-hidden="true">
                            <span class="profile_role_city__name" v-text="profileViewRoleParts.city"></span>
                        </span>
                        <span v-if="profileViewRoleParts.suffix">
                            &nbsp;<span v-text="profileViewRoleParts.suffix"></span>
                        </span>
                    </template>
                    <template v-else>
                        <span v-text="profileViewRoleParts.label"></span>
                    </template>
                </p>

                <div class="repository_segmented repository_segmented--profile"
                     data-segmented="profileViewTab"
                     data-active="information">
                    <button class="repository_segmented__button"
                            type="button"
                            data-segmented-value="information"
                            @click="setSegment('profileViewTab', 'information')"
                            th:text="#{profile.page.tabs.information}">profile.page.tabs.information</button>
                    <button class="repository_segmented__button"
                            type="button"
                            data-segmented-value="ownPets"
                            @click="setSegment('profileViewTab', 'ownPets')"
                            th:text="#{profile.page.tabs.ownPets}">profile.page.tabs.ownPets</button>
                    <button class="repository_segmented__button"
                            type="button"
                            data-segmented-value="offers"
                            @click="setSegment('profileViewTab', 'offers')"
                            th:text="#{profile.page.tabs.offers}">profile.page.tabs.offers</button>
                    <span class="repository_segmented__indicator" aria-hidden="true"></span>
                </div>

                <section v-show="profileViewTab === 'information'"
                         data-segment-panel="profileViewTab"
                         data-segment-value="information"
                         class="profile_panel__tab_panel profile_panel__tab_panel--info">
                    <dl class="profile_facts">
                        <div class="profile_facts__item">
                            <dt class="profile_facts__label">
                                <img class="profile_facts__label_icon"
                                     th:src="@{/assets/media/1F4E7.svg}"
                                     src="/assets/media/1F4E7.svg"
                                     alt=""
                                     aria-hidden="true">
                                <span th:text="#{profile.page.labels.email}">profile.page.labels.email</span>
                            </dt>
                            <dd v-text="profileViewUser.email"></dd>
                        </div>
                        <div class="profile_facts__item">
                            <dt class="profile_facts__label">
                                <img class="profile_facts__label_icon"
                                     th:src="@{/assets/media/260E.svg}"
                                     src="/assets/media/260E.svg"
                                     alt=""
                                     aria-hidden="true">
                                <span th:text="#{profile.page.labels.phone}">profile.page.labels.phone</span>
                            </dt>
                            <dd v-text="profileViewPhoneLabel"></dd>
                        </div>
                    </dl>

                    <section class="profile_bio" v-if="profileViewUser.bio">
                        <h3 class="profile_bio__title" th:text="#{profile.page.labels.bio}">profile.page.labels.bio</h3>
                        <p class="profile_bio__text" v-text="profileViewUser.bio"></p>
                    </section>

                    <section class="profile_species" v-if="profileViewAcceptedPetSpecies.length">
                        <h3 class="profile_species__title" th:text="#{profile.page.labels.acceptedPets}">profile.page.labels.acceptedPets</h3>
                        <ul class="profile_species__list">
                            <li v-for="species in profileViewAcceptedPetSpecies"
                                :key="species.value"
                                class="profile_species__chip">
                                <img class="profile_species__icon" :src="species.emojiPath" alt="" aria-hidden="true">
                                <span class="profile_species__label" v-text="species.label"></span>
                            </li>
                        </ul>
                    </section>

                    <section class="profile_rating">
                        <h3 class="profile_rating__title" v-text="profileViewRatingHeading"></h3>
                        <div class="profile_rating__stars"
                             role="img"
                             :aria-label="profileViewRatingAriaLabel">
                            <span v-for="(fill, index) in profileViewRatingStarFills"
                                  :key="'profile-rating-star-' + index"
                                  class="profile_rating__star"
                                  :style="{ '--profile-star-fill': (fill + '%') }"
                                  aria-hidden="true">
                                <span class="profile_rating__star-layer profile_rating__star-layer--base">
                                    <svg viewBox="0 0 24 24" class="profile_rating__star-svg" focusable="false" aria-hidden="true">
                                        <path class="profile_rating__star-shape" d="M12,17.27L18.18,21L16.54,13.97L22,9.24L14.81,8.63L12,2L9.19,8.63L2,9.24L7.46,13.97L5.82,21L12,17.27Z"></path>
                                    </svg>
                                </span>
                                <span class="profile_rating__star-layer profile_rating__star-layer--fill">
                                    <svg viewBox="0 0 24 24" class="profile_rating__star-svg" focusable="false" aria-hidden="true">
                                        <path class="profile_rating__star-shape" d="M12,17.27L18.18,21L16.54,13.97L22,9.24L14.81,8.63L12,2L9.19,8.63L2,9.24L7.46,13.97L5.82,21L12,17.27Z"></path>
                                    </svg>
                                </span>
                            </span>
                        </div>
                    </section>
                </section>

                <section v-show="profileViewTab === 'ownPets'"
                         data-segment-panel="profileViewTab"
                         data-segment-value="ownPets"
                         class="profile_panel__tab_panel profile_panel__tab_panel--pets">
                    <section class="my_pets_reel_shell profile_pets_reel_shell"
                             th:attr="aria-label=#{myPets.page.carouselAria}">
                        <template v-if="myPetsPets.length && myPetsActivePet">
                            <button class="my_pets_reel__nav my_pets_reel__nav--prev"
                                    type="button"
                                    @click="navigateMyPetsCarousel(-1)"
                                    :aria-label="myPetsStrings.actions.previous">
                                <svg class="my_pets_reel__nav_icon" viewBox="0 0 16 16" focusable="false" aria-hidden="true">
                                    <path d="M9.9 3.6 5.5 8l4.4 4.4"></path>
                                </svg>
                            </button>

                            <div class="my_pets_reel__viewport">
                                <article v-for="item in myPetsCarouselRenderItems"
                                         :key="'profile-pets-reel-' + item.pet.id"
                                         class="my_pets_reel__card"
                                         :class="item.positionClass">
                                    <div class="my_pets_reel__card_static">
                                        <div class="my_pets_reel__media">
                                            <img class="my_pets_reel__image"
                                                 :src="resolveMyPetImagePath(item.pet)"
                                                 :alt="item.pet.name"
                                                 loading="lazy"
                                                 decoding="async">
                                        </div>
                                        <span class="my_pets_reel__species">
                                            <img class="my_pets_reel__species_icon"
                                                 :src="resolveMyPetSpeciesEmoji(item.pet)"
                                                 alt=""
                                                 aria-hidden="true">
                                            <span v-text="resolveMyPetSpeciesLabel(item.pet)"></span>
                                        </span>
                                        <span class="my_pets_reel__name" v-text="item.pet.name"></span>
                                    </div>

                                    <div class="my_pets_reel__reflection" aria-hidden="true">
                                        <img class="my_pets_reel__reflection_image"
                                             :src="resolveMyPetImagePath(item.pet)"
                                             alt="">
                                    </div>
                                </article>
                            </div>

                            <button class="my_pets_reel__nav my_pets_reel__nav--next"
                                    type="button"
                                    @click="navigateMyPetsCarousel(1)"
                                    :aria-label="myPetsStrings.actions.next">
                                <svg class="my_pets_reel__nav_icon" viewBox="0 0 16 16" focusable="false" aria-hidden="true">
                                    <path d="m6.1 3.6 4.4 4.4-4.4 4.4"></path>
                                </svg>
                            </button>
                        </template>

                        <div v-else class="my_pets_empty">
                            <h3 class="my_pets_empty__title" th:text="#{myPets.page.emptyTitle}">myPets.page.emptyTitle</h3>
                        </div>
                    </section>
                </section>

                <section v-show="profileViewTab === 'offers'"
                         data-segment-panel="profileViewTab"
                         data-segment-value="offers"
                         class="profile_panel__tab_panel profile_panel__tab_panel--offers">
                    <section class="my_offers_carousel profile_offers_carousel"
                             th:attr="aria-label=#{myOffers.page.carouselAria}">
                        <template v-if="myOffersOffers.length && myOffersActiveOffer">
                            <button class="my_offers_carousel__nav my_offers_carousel__nav--prev"
                                    type="button"
                                    @click="navigateMyOffersCarousel(-1)"
                                    :aria-label="myOffersStrings.actions.previous">
                                <svg class="my_offers_carousel__nav_icon" viewBox="0 0 16 16" focusable="false" aria-hidden="true">
                                    <path d="M9.9 3.6 5.5 8l4.4 4.4"></path>
                                </svg>
                            </button>

                            <div class="my_offers_carousel__viewport">
                                <article v-for="item in myOffersCarouselRenderItems"
                                         :key="'profile-offers-card-' + item.offer.id"
                                         class="my_offers_carousel__card"
                                         :class="item.positionClass">
                                    <div class="my_offers_card"
                                         :class="{ 'my_offers_card--with-image': hasMyOfferCardImage(item.offer) }"
                                         :style="buildMyOfferCardStyle(item.offer)">
                                        <div class="my_offers_card__header">
                                            <span class="my_offers_card__price" v-text="formatMyOfferPrice(item.offer.pricePerDay)"></span>
                                        </div>
                                        <h3 class="my_offers_card__title" v-text="item.offer.title"></h3>
                                        <p class="my_offers_card__description" v-text="item.offer.description"></p>

                                        <div class="my_offers_card__species" v-if="resolveMyOfferSpecies(item.offer).length">
                                            <span class="my_offers_card__species_chip"
                                                  v-for="species in resolveMyOfferSpecies(item.offer)"
                                                  :key="'profile-offer-species-' + item.offer.id + '-' + species.value">
                                                <img class="my_offers_card__species_icon" :src="species.emojiPath" alt="" aria-hidden="true">
                                                <span v-text="species.label"></span>
                                            </span>
                                        </div>

                                        <ul class="my_offers_card__services" v-if="resolveMyOfferServiceList(item.offer).length">
                                            <li v-for="(service, serviceIndex) in resolveMyOfferServiceList(item.offer)"
                                                :key="'profile-offer-service-' + item.offer.id + '-' + serviceIndex"
                                                v-text="service"></li>
                                        </ul>
                                    </div>
                                </article>
                            </div>

                            <button class="my_offers_carousel__nav my_offers_carousel__nav--next"
                                    type="button"
                                    @click="navigateMyOffersCarousel(1)"
                                    :aria-label="myOffersStrings.actions.next">
                                <svg class="my_offers_carousel__nav_icon" viewBox="0 0 16 16" focusable="false" aria-hidden="true">
                                    <path d="m6.1 3.6 4.4 4.4-4.4 4.4"></path>
                                </svg>
                            </button>
                        </template>

                        <div v-else class="my_offers_empty">
                            <h3 class="my_offers_empty__title" th:text="#{myOffers.page.emptyTitle}">myOffers.page.emptyTitle</h3>
                        </div>
                    </section>
                </section>
            </div>
        </article>
    </section>
</th:block>
</html>
