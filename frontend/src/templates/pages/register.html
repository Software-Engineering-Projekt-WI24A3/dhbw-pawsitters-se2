<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: shell(#{meta.register.title}, #{meta.register.description}, ${currentLocale}, ${localeLinks}, ${currentLocaleLabel}, ${currentLocaleCode}, ${currentLocaleFlagPath}, 'page-auth', ~{::content})}">
<th:block th:fragment="content">
    <section class="auth_layout">
        <div class="auth_shell">
            <section class="auth_intro">
                <div>
                    <p class="auth_intro__eyebrow" th:text="#{auth.shared.eyebrow}">auth.shared.eyebrow</p>
                    <h2 class="auth_intro__title" th:text="#{auth.shared.title}">auth.shared.title</h2>
                    <p class="auth_intro__text" th:text="#{auth.shared.text}">auth.shared.text</p>
                </div>
                <ul class="auth_intro__list">
                    <li class="auth_intro__item" th:text="#{auth.shared.point.one}">auth.shared.point.one</li>
                    <li class="auth_intro__item" th:text="#{auth.shared.point.two}">auth.shared.point.two</li>
                    <li class="auth_intro__item" th:text="#{auth.shared.point.three}">auth.shared.point.three</li>
                </ul>
            </section>

            <section class="auth_card">
                <div class="auth_card__header">
                    <p class="auth_card__eyebrow" th:text="#{brand.name}">brand.name</p>
                    <h1 class="auth_card__title" th:text="#{auth.register.title}">auth.register.title</h1>
                    <p class="auth_card__text" th:text="#{auth.register.text}">auth.register.text</p>
                </div>

                <form class="auth_form" novalidate>
                    <label class="auth_field corp_field">
                        <span class="sr-only" th:text="#{auth.register.name}">auth.register.name</span>
                        <input class="auth_input corp_input"
                               type="text"
                               autocomplete="name"
                               th:attr="aria-label=#{auth.register.name},placeholder=#{auth.register.namePlaceholder}">
                        <span class="auth_field__label corp_field__label"
                              th:text="#{auth.register.namePlaceholder}">auth.register.namePlaceholder</span>
                    </label>
                    <label class="auth_field corp_field">
                        <span class="sr-only" th:text="#{auth.register.email}">auth.register.email</span>
                        <input class="auth_input corp_input"
                               type="email"
                               autocomplete="email"
                               th:attr="aria-label=#{auth.register.email},placeholder=#{auth.register.emailPlaceholder}">
                        <span class="auth_field__label corp_field__label"
                              th:text="#{auth.register.emailPlaceholder}">auth.register.emailPlaceholder</span>
                    </label>
                    <label class="auth_field corp_field">
                        <span class="sr-only" th:text="#{auth.register.password}">auth.register.password</span>
                        <input class="auth_input corp_input"
                               type="password"
                               autocomplete="new-password"
                               th:attr="aria-label=#{auth.register.password},placeholder=#{auth.register.passwordPlaceholder}">
                        <span class="auth_field__label corp_field__label"
                              th:text="#{auth.register.passwordPlaceholder}">auth.register.passwordPlaceholder</span>
                    </label>
                    <button class="button button--primary auth_submit" type="button" th:text="#{auth.register.submit}">auth.register.submit</button>
                </form>

                <div class="auth_link_card">
                    <div>
                        <p class="auth_link_card__eyebrow" th:text="#{auth.register.alt.eyebrow}">auth.register.alt.eyebrow</p>
                        <h2 class="auth_link_card__title" th:text="#{auth.register.alt.title}">auth.register.alt.title</h2>
                        <p class="auth_link_card__text" th:text="#{auth.register.alt.text}">auth.register.alt.text</p>
                    </div>
                    <button class="button button--secondary auth_link_card__action" type="button" @click="openLoginModal()" th:text="#{auth.register.alt.cta}">auth.register.alt.cta</button>
                </div>
            </section>
        </div>
    </section>
</th:block>
</html>
