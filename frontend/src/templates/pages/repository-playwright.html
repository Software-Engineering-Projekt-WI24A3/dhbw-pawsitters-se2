<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: shell(#{meta.repositoryPlaywright.title}, #{meta.repositoryPlaywright.description}, ${currentLocale}, ${localeLinks}, ${currentLocaleLabel}, ${currentLocaleCode}, ${currentLocaleFlagPath}, 'page-repository page-repository--playwright', ~{::content})}">
<th:block th:fragment="content">
    <section class="repo_stage">
        <div class="repo_stack repo_stack--page">
            <section class="repository_workspace repository_workspace--page repository_workspace--playwright"
                     data-playwright-runner
                     th:attr="data-status-idle=#{repository.playwright.status.idle},data-status-pending=#{repository.playwright.status.pending},data-status-running=#{repository.playwright.status.running},data-status-passed=#{repository.playwright.status.passed},data-status-failed=#{repository.playwright.status.failed},data-status-skipped=#{repository.playwright.status.skipped},data-last-run-never=#{repository.playwright.never},data-loading-text=#{repository.playwright.loading},data-notification-title=#{repository.playwright.notificationTitle},data-status-request-failed=#{repository.playwright.statusRequestFailed},data-run-request-failed=#{repository.playwright.runRequestFailed}">
                <div class="repository_compactbar">
                    <div class="repository_switch repository_switch--page">
                        <a class="repository_switch__button repository_switch__button--active"
                           th:href="${repositoryPlaywrightPath}">
                            <img class="repository_switch__icon"
                                 src="https://assets.streamlinehq.com/image/private/w_300,h_300,ar_1/f_auto/v1/icons/2/playwright-y50bnthygb3rvsppvkm9e.png/playwright-q55xzpenhgjsodksybst.png?_a=DATAiZAAZAA0"
                                 alt=""
                                 aria-hidden="true">
                            <span th:text="#{repository.playwright.label}">repository.playwright.label</span>
                        </a>
                        <a class="repository_switch__button"
                           th:href="${repositoryGitPath}">
                            <img class="repository_switch__icon"
                                 src="https://www.linux-magazin.de/wp-content/uploads/2026/02/Git-Icon-1788C.png"
                                 alt=""
                                 aria-hidden="true">
                            <span th:text="#{repository.git.label}">repository.git.label</span>
                        </a>
                        <a class="repository_switch__button"
                           th:href="${repositoryBoardPath}"
                           th:text="#{repository.board.label}">repository.board.label</a>
                    </div>
                </div>

                <div class="playwright_runner">
                    <header class="playwright_runner__header">
                        <h1 class="playwright_runner__title"
                            th:text="#{repository.playwright.title}">repository.playwright.title</h1>
                        <div class="playwright_runner__actions">
                            <button class="button button--primary playwright_runner__run"
                                    type="button"
                                    @click="runPlaywrightTests()"
                                    :disabled="playwrightRunPending || playwrightRunning"
                                    :aria-busy="String(playwrightRunPending || playwrightRunning)">
                                <img class="repository_switch__icon"
                                     src="https://assets.streamlinehq.com/image/private/w_300,h_300,ar_1/f_auto/v1/icons/2/playwright-y50bnthygb3rvsppvkm9e.png/playwright-q55xzpenhgjsodksybst.png?_a=DATAiZAAZAA0"
                                     alt=""
                                     aria-hidden="true">
                                <span v-if="playwrightRunPending || playwrightRunning"
                                      th:text="#{repository.playwright.running}">repository.playwright.running</span>
                                <span v-else
                                      th:text="#{repository.playwright.run}">repository.playwright.run</span>
                            </button>
                        </div>
                    </header>

                    <p v-if="playwrightStatusError"
                       class="playwright_error"
                       v-text="playwrightStatusError"></p>

                    <div v-if="playwrightSessionStarted || playwrightRunPending || playwrightRunning"
                         class="playwright_run_surface">
                        <div v-if="playwrightRunPending || playwrightRunning"
                             class="repository_live_loading playwright_live_loading"
                             role="status"
                             aria-live="polite">
                            <span class="repository_live_loading__dots" aria-hidden="true">
                                <span class="repository_live_loading__dot"></span>
                                <span class="repository_live_loading__dot"></span>
                                <span class="repository_live_loading__dot"></span>
                            </span>
                            <p class="repository_live_loading__text"
                               v-text="playwrightLoadingLabel"></p>
                        </div>

                        <section class="playwright_console_panel">
                            <pre class="playwright_logs_console"
                                 data-playwright-log-console
                                 v-text="playwrightLogText"></pre>
                            <p v-if="!playwrightLogText"
                               class="playwright_logs_empty"
                               th:text="#{repository.playwright.logsEmpty}">repository.playwright.logsEmpty</p>
                        </section>
                    </div>
                </div>
            </section>
        </div>
    </section>
</th:block>
</html>
