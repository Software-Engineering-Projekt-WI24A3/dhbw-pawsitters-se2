<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: shell(#{meta.repositoryKanban.title}, #{meta.repositoryKanban.description}, ${currentLocale}, ${localeLinks}, ${currentLocaleLabel}, ${currentLocaleCode}, ${currentLocaleFlagPath}, ${loginPath}, 'page-repository page-repository--kanban', ~{::content})}">
<th:block th:fragment="content">
    <section class="repo_stage">
        <div class="repo_stack repo_stack--page">
            <section class="repository_workspace repository_workspace--page"
                     data-repository-live>
                <div data-repository-bootstrap hidden>{}</div>

                <div class="repository_compactbar">
                    <div class="repository_switch repository_switch--page">
                        <a class="repository_switch__button"
                           th:href="${repositoryGitPath}">
                            <img class="repository_switch__icon"
                                 src="https://www.linux-magazin.de/wp-content/uploads/2026/02/Git-Icon-1788C.png"
                                 alt=""
                                 aria-hidden="true">
                            <span th:text="#{repository.git.label}">repository.git.label</span>
                        </a>
                        <a class="repository_switch__button repository_switch__button--active"
                           th:href="${repositoryBoardPath}"
                           th:text="#{repository.board.label}">repository.board.label</a>
                    </div>
                </div>

                <div class="board_metrics">
                    <article class="board_metric">
                        <span class="board_metric__value"
                              v-text="repository.board.summary.openCount"></span>
                        <span class="board_metric__label" th:text="#{repository.board.open}">repository.board.open</span>
                    </article>
                    <article class="board_metric">
                        <span class="board_metric__value"
                              v-text="repository.board.summary.assignedCount"></span>
                        <span class="board_metric__label" th:text="#{repository.board.assigned}">repository.board.assigned</span>
                    </article>
                    <article class="board_metric">
                        <span class="board_metric__value"
                              v-text="repository.board.summary.ownerCount"></span>
                        <span class="board_metric__label" th:text="#{repository.board.owners}">repository.board.owners</span>
                    </article>
                    <article class="board_metric">
                        <span class="board_metric__value"
                              v-text="repository.board.summary.criteriaCount"></span>
                        <span class="board_metric__label" th:text="#{repository.board.criteriaCount}">repository.board.criteriaCount</span>
                    </article>
                </div>

                <div class="repository_segmented repository_segmented--board"
                     v-if="!repositoryLoading"
                     data-segmented="boardView"
                     data-active="frontend">
                    <button class="repository_segmented__button"
                            type="button"
                            v-for="column in repository.board.columns"
                            :key="column.id"
                            :data-segmented-value="column.id"
                            @click="setSegment('boardView', column.id)"
                            v-text="column.label"></button>
                    <span class="repository_segmented__indicator" aria-hidden="true"></span>
                </div>

                <div v-if="repositoryLoading" class="repository_live_loading" role="status" aria-live="polite">
                    <span class="repository_live_loading__dots" aria-hidden="true">
                        <span class="repository_live_loading__dot"></span>
                        <span class="repository_live_loading__dot"></span>
                        <span class="repository_live_loading__dot"></span>
                    </span>
                    <p class="repository_live_loading__text"
                       th:text="#{repository.liveLoading}">repository.liveLoading</p>
                </div>

                <div v-if="!repositoryLoading" class="board_legend">
                    <span class="board_legend__owner"
                          v-for="owner in repository.board.owners"
                          :key="owner.login"
                          :style="owner.style">
                        <a v-if="owner.profileUrl"
                           class="repo_avatar repo_avatar--link"
                           :href="owner.profileUrl"
                           target="_blank"
                           rel="noreferrer"
                           :title="owner.name">
                            <img v-if="owner.avatarUrl"
                                 class="repo_avatar__image"
                                 :src="owner.avatarUrl"
                                 :alt="owner.name">
                            <span v-else class="repo_avatar__fallback" v-text="owner.initials"></span>
                        </a>
                        <span v-else class="repo_avatar" :title="owner.name">
                            <img v-if="owner.avatarUrl"
                                 class="repo_avatar__image"
                                 :src="owner.avatarUrl"
                                 :alt="owner.name">
                            <span v-else class="repo_avatar__fallback" v-text="owner.initials"></span>
                        </span>
                        <span class="board_legend__name" v-text="owner.name"></span>
                    </span>
                </div>

                <div v-if="!repositoryLoading" class="board_stage">
                    <section v-if="currentBoardColumn"
                             class="board_showcase board_column"
                             :style="currentBoardColumn.toneStyle"
                             :data-segment-value="currentBoardColumn.id"
                             data-segment-panel="boardView">
                        <div class="board_showcase__header">
                            <span class="board_showcase__label" v-text="currentBoardColumn.label"></span>
                            <span class="board_showcase__count" v-text="currentBoardColumn.cards.length"></span>
                        </div>

                        <div v-if="currentBoardColumn.cards.length" class="board_showcase__grid">
                            <article class="board_card board_card--compact"
                               v-for="card in currentBoardColumn.cards"
                               :key="card.key"
                               :class="card.toneClass"
                               :style="card.ownerStyle"
                               role="button"
                               tabindex="0"
                               @click="openBoardCardModal(card.key)"
                               @keydown.enter.prevent="openBoardCardModal(card.key)"
                               @keydown.space.prevent="openBoardCardModal(card.key)">
                                <span class="board_card__rule" aria-hidden="true"></span>

                                <div class="board_card__topline">
                                    <span class="board_card__number" v-text="card.numberLabel"></span>
                                    <span class="board_card__state" v-text="card.stateLabel"></span>
                                </div>

                                <div class="board_card__trackline">
                                    <span class="board_card__track" v-text="card.track"></span>
                                    <div class="board_card__assignees">
                                        <span class="board_card__assignee"
                                              v-for="assignee in card.assignees"
                                              :key="card.key + '-' + assignee.login"
                                              :style="assignee.style"
                                              :title="assignee.name">
                                            <img v-if="assignee.avatarUrl"
                                                 class="repo_avatar__image"
                                                 :src="assignee.avatarUrl"
                                                 :alt="assignee.name">
                                            <span v-else class="repo_avatar__fallback" v-text="assignee.initials"></span>
                                        </span>
                                    </div>
                                </div>

                                <h2 class="board_card__title" v-text="card.title"></h2>

                                <div class="board_card__footer">
                                    <span class="board_card__date" v-text="card.updatedLabel"></span>
                                </div>
                            </article>
                        </div>

                        <p v-else class="board_showcase__empty"
                           v-text="repository.board.emptyText"></p>
                    </section>
                </div>

                <teleport to="body">
                    <div v-if="activeBoardCard"
                         class="repo_modal"
                         role="dialog"
                         aria-modal="true"
                         @click.self="closeRepositoryModal()">
                        <article class="repo_modal__surface repo_modal__surface--board"
                                 :style="activeBoardCard.ownerStyle">
                            <button class="repo_modal__close"
                                    type="button"
                                    th:attr="aria-label=#{nav.close}"
                                    @click="closeRepositoryModal()">
                                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                                    <path d="M6 6l12 12M18 6L6 18"></path>
                                </svg>
                            </button>

                            <div class="repo_modal__scroll">
                                <header class="repo_modal__header">
                                    <div class="board_card__topline">
                                        <span class="board_card__number" v-text="activeBoardCard.numberLabel"></span>
                                        <span class="board_card__state" v-text="activeBoardCard.stateLabel"></span>
                                    </div>

                                    <div class="board_card__trackline">
                                        <span class="board_card__track" v-text="activeBoardCard.track"></span>
                                        <div class="board_card__assignees">
                                            <span class="board_card__assignee"
                                                  v-for="assignee in activeBoardCard.assignees"
                                                  :key="activeBoardCard.key + '-modal-' + assignee.login"
                                                  :style="assignee.style"
                                                  :title="assignee.name">
                                                <img v-if="assignee.avatarUrl"
                                                     class="repo_avatar__image"
                                                     :src="assignee.avatarUrl"
                                                     :alt="assignee.name">
                                                <span v-else class="repo_avatar__fallback" v-text="assignee.initials"></span>
                                            </span>
                                        </div>
                                    </div>

                                    <h2 class="repo_modal__title" v-text="activeBoardCard.title"></h2>
                                </header>

                                <p v-if="activeBoardCard.hasDescription"
                                   class="repo_modal__description"
                                   v-text="activeBoardCard.description"></p>

                                <div v-if="activeBoardCard.hasLabels" class="board_card__labels">
                                    <span class="board_card__label"
                                          v-for="label in activeBoardCard.labels"
                                          :key="activeBoardCard.key + '-modal-' + label"
                                          v-text="label"></span>
                                </div>

                                <div v-if="activeBoardCard.hasEndpoints" class="repo_modal__section">
                                    <p class="repo_modal__section-label" th:text="#{repository.board.endpoints}">repository.board.endpoints</p>
                                    <ul class="board_card__list">
                                        <li class="board_card__list-item board_card__list-item--code"
                                            v-for="endpoint in activeBoardCard.endpoints"
                                            :key="activeBoardCard.key + '-modal-' + endpoint"
                                            v-text="endpoint"></li>
                                    </ul>
                                </div>

                                <div v-if="activeBoardCard.hasCriteria" class="repo_modal__section">
                                    <p class="repo_modal__section-label" th:text="#{repository.board.criteria}">repository.board.criteria</p>
                                    <ul class="board_card__list">
                                        <li class="board_card__list-item"
                                            v-for="criterion in activeBoardCard.criteria"
                                            :key="activeBoardCard.key + '-modal-' + criterion"
                                            v-text="criterion"></li>
                                    </ul>
                                </div>

                                <div class="repo_modal__meta">
                                    <span class="repo_modal__meta-item">
                                        <span th:text="#{repository.board.created}">repository.board.created</span>
                                        <span>: </span>
                                        <span v-text="activeBoardCard.createdLabel"></span>
                                    </span>
                                    <span class="repo_modal__meta-item">
                                        <span th:text="#{repository.board.updated}">repository.board.updated</span>
                                        <span>: </span>
                                        <span v-text="activeBoardCard.updatedLabel"></span>
                                    </span>
                                </div>
                            </div>

                            <footer class="repo_modal__footer">
                                <a v-if="activeBoardCard.url"
                                   class="repo_modal__github"
                                   :href="activeBoardCard.url"
                                   target="_blank"
                                   rel="noreferrer">
                                    <img class="repo_modal__github-icon repo_menu__icon"
                                         src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg"
                                         alt=""
                                         aria-hidden="true">
                                    <span th:text="#{nav.repository}">nav.repository</span>
                                </a>
                            </footer>
                        </article>
                    </div>
                </teleport>
            </section>
        </div>
    </section>
</th:block>
</html>
