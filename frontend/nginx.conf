map $arg_locale $localized_prefix {
    default "";
    "~*^en$" "/en";
    "~*^ro$" "/ro";
}

map $arg_locale $repository_snapshot_locale {
    default "de";
    "~*^de$" "de";
    "~*^en$" "en";
    "~*^ro$" "ro";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;

    location = /api/pets/choices {
        add_header Cache-Control "no-store";
        try_files /assets/data/pet-choices.json =404;
    }

    location = /api/pets/choices.json {
        add_header Cache-Control "no-store";
        try_files /assets/data/pet-choices.json =404;
    }

    location = /api/locations/countries.json {
        add_header Cache-Control "no-store";
        try_files /assets/data/country-flags.json =404;
    }

    location = /api/repository/live.json {
        add_header Cache-Control "no-store";
        try_files /assets/data/repository-live.$repository_snapshot_locale.json /assets/data/repository-live.de.json =404;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* ^/(de|en|ro)/profile/[^/]+/?$ {
        try_files /$1/profile/index.html /$1/404/index.html /404.html;
    }

    location ~* ^/profile/[^/]+/?$ {
        try_files /profile/index.html /404.html;
    }

    location / {
        set $localized_uri "${localized_prefix}$uri";
        set $localized_uri_slash "${localized_prefix}$uri/";
        set $localized_not_found "${localized_prefix}/404";

        try_files $localized_uri $localized_uri_slash $uri $uri/ $localized_not_found /404.html;
    }

    error_page 404 /404.html;
}
