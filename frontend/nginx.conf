map $arg_locale $localized_suffix {
    default "";
    "~*^en$" ".en";
    "~*^ro$" ".ro";
}

map $arg_locale $repository_snapshot_locale {
    default "de";
    "~*^de$" "de";
    "~*^en$" "en";
    "~*^ro$" "ro";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;

    location = /api/pets/choices {
        add_header Cache-Control "no-store";
        try_files /assets/data/pet-choices.json =404;
    }

    location = /api/pets/choices.json {
        add_header Cache-Control "no-store";
        try_files /assets/data/pet-choices.json =404;
    }

    location = /api/locations/countries.json {
        add_header Cache-Control "no-store";
        try_files /assets/data/country-flags.json =404;
    }

    location = /api/repository/live.json {
        add_header Cache-Control "no-store";
        try_files /assets/data/repository-live.$repository_snapshot_locale.json /assets/data/repository-live.de.json =404;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* ^/(de|en|ro)(/.*)?$ {
        if ($2 = "") {
            return 302 /?locale=$1;
        }
        return 302 $2?locale=$1;
    }

    location ~* ^/profile/\d+/?$ {
        try_files /profile/index$localized_suffix.html /profile/index.html /404/index$localized_suffix.html /404/index.html /404.html;
    }

    location ~* ^/search/.+$ {
        try_files /search/index$localized_suffix.html /search/index.html /404/index$localized_suffix.html /404/index.html /404.html;
    }

    location = / {
        try_files /index$localized_suffix.html /index.html /404/index$localized_suffix.html /404/index.html /404.html;
    }

    location / {
        try_files $uri$localized_suffix $uri/index$localized_suffix.html $uri $uri/ /404/index$localized_suffix.html /404/index.html /404.html;
    }

    error_page 404 /404.html;
}
