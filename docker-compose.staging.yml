services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pawsitters}
      MYSQL_USER: ${MYSQL_USER:-pawsitters}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD before starting staging}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD before starting staging}
    volumes:
      - pawsitters_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql -h 127.0.0.1 -u\"$${MYSQL_USER}\" -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    image: ghcr.io/software-engineering-projekt-wi24a3/dhbw-pawsitters-se2-backend:${IMAGE_TAG:-develop}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting staging}
      SPRING_PROFILES_ACTIVE: staging
      APP_UPLOAD_DIR: /app/uploads
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-pawsitters}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-pawsitters}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD before starting staging}
    ports:
      - "8080:8080"
    volumes:
      - pawsitters_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: ghcr.io/software-engineering-projekt-wi24a3/dhbw-pawsitters-se2-frontend:${IMAGE_TAG:-develop}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"

volumes:
  pawsitters_uploads:
  pawsitters_mysql_data:
