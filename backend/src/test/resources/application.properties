# Tests use an isolated in-memory database so they do not require local MySQL.
spring.datasource.url=jdbc:h2:mem:pawsitters-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:dev-only-pawsitters-jwt-secret-change-me-32}
jwt.expiration=3600000

app.upload.dir=${java.io.tmpdir}/pawsitters-test-uploads
