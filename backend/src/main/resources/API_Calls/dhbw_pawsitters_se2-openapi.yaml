openapi: 3.0.3
info:
  title: Pawsitters API
  version: 1.2.0
  description: OpenAPI-Dokumentation fuer die Pawsitters JSON-API mit einheitlichem Response-Envelope.
  contact:
    name: Pawsitters API Team
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
    description: Endpunkte fuer Login, Logout, Registrierung und Sessionstatus.
  - name: Users
    description: Endpunkte zur Benutzerverwaltung.
  - name: Pets
    description: Endpunkte zur Haustierverwaltung.
  - name: Offers
    description: Endpunkte zum Erstellen und Verwalten von Betreuungspaketen.
  - name: Hosts
    description: Endpunkte fuer Gastgeberprofile, Unterkunftsgalerien und Review-Statistiken.
  - name: Marketplace
    description: Endpunkte zur Gastgeber- und Angebotsuebersicht, Suche und Filteroptionen.
  - name: Chats
    description: Endpunkte fuer angebotsbezogene Live-Chats, Nachrichten und Bildanhaenge.
paths:
  /api/auth/register:
    post:
      operationId: authRegister
      tags: [Auth]
      summary: Registrieren und einloggen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Registrierung erfolgreich.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/auth/login:
    post:
      operationId: authLogin
      tags: [Auth]
      summary: Einloggen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login erfolgreich.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/logout:
    post:
      operationId: authLogout
      tags: [Auth]
      summary: Ausloggen
      responses:
        "200":
          description: Logout erfolgreich.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"
  /api/auth/session:
    get:
      operationId: authSession
      tags: [Auth]
      summary: Sessionstatus abrufen
      responses:
        "200":
          description: Sessionstatus.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionApiResponse"
  /api/users/register:
    post:
      operationId: registerUser
      tags: [Users]
      summary: Benutzer registrieren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Benutzer erfolgreich registriert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/users/{id}:
    get:
      operationId: getUserById
      tags: [Users]
      summary: Benutzer abrufen
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Benutzer gefunden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateUser
      tags: [Users]
      summary: Benutzer vollstaendig aktualisieren
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: Benutzer aktualisiert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserApiResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: patchUser
      tags: [Users]
      summary: Benutzer partiell aktualisieren
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatchRequest"
      responses:
        "200":
          description: Benutzer aktualisiert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserApiResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteUser
      tags: [Users]
      summary: Benutzer loeschen
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Benutzer geloescht.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteApiResponse"
  /api/users/me:
    get:
      operationId: getCurrentUser
      tags: [Users]
      summary: Aktuellen Benutzer abrufen
      responses:
        "200":
          description: Aktueller Benutzer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/users/mailExists:
    get:
      operationId: mailExists
      tags: [Users]
      summary: E-Mail pruefen
      parameters:
        - name: mail
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Ergebnis der Pruefung.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailExistsApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/users/{id}/roles:
    patch:
      operationId: updateUserRole
      tags: [Users]
      summary: Benutzerrolle aendern
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdateRequest"
      responses:
        "200":
          description: Rolle aktualisiert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserApiResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/users/{id}/profile-image:
    post:
      operationId: uploadUserProfileImage
      tags: [Users]
      summary: Profilbild hochladen
      description: Erwartet ein Multipart-Feld `image`; das Backend akzeptiert aus Kompatibilitaetsgruenden auch `file`. Erlaubt sind gueltige JPEG-, PNG-, GIF-, WebP- und BMP-Bilddateien bis 5 MB.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Profilbild aktualisiert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      operationId: deleteUserProfileImage
      tags: [Users]
      summary: Eigenes Profilbild loeschen
      description: Entfernt ein eigenes Upload-Bild best-effort und setzt `profilePicture` auf das feste Pawsitters-Placeholder-Bild zurueck.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Profilbild geloescht bzw. auf Placeholder zurueckgesetzt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserApiResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/hosts:
    post:
      operationId: createOrUpdateHostProfile
      tags: [Hosts]
      summary: Gastgeberprofil anlegen oder aktualisieren
      description: Legt fuer den angemeldeten Gastgeber ein Profil mit Erfahrungen und Unterkunftsbeschreibung an oder aktualisiert ein bestehendes Profil. `experience` oder `experiences` muss mindestens einen nicht-leeren Wert liefern.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostCreateRequest"
      responses:
        "200":
          description: Gastgeberprofil gespeichert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostProfileApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/hosts/{id}:
    get:
      operationId: getHostProfile
      tags: [Hosts]
      summary: Gastgeberprofil abrufen
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Gastgeberprofil gefunden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostProfileApiResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/hosts/{id}/stats:
    get:
      operationId: getHostStats
      tags: [Hosts]
      summary: Review-Statistiken eines Gastgebers abrufen
      description: Berechnet Durchschnittswerte aus den gespeicherten Reviews des Gastgebers.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Review-Statistiken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostStatsApiResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/hosts/{id}/gallery:
    post:
      operationId: uploadHostGalleryImage
      tags: [Hosts]
      summary: Unterkunftsbild zur Gastgeber-Galerie hochladen
      description: Erwartet ein Multipart-Feld `image`; das Backend akzeptiert aus Kompatibilitaetsgruenden auch `file`. Erlaubt sind gueltige JPEG-, PNG-, GIF-, WebP- und BMP-Bilddateien bis 5 MB.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Galerie-Bild gespeichert und mit dem Host-Profil verknuepft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostProfileApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /api/pets:
    get:
      operationId: getPets
      tags: [Pets]
      summary: Eigene Haustiere abrufen
      responses:
        "200":
          description: Haustierliste.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetListApiResponse"
    post:
      operationId: createPet
      tags: [Pets]
      summary: Haustier erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetRequest"
      responses:
        "200":
          description: Haustier erstellt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/pets/{id}:
    put:
      operationId: updatePet
      tags: [Pets]
      summary: Haustier aktualisieren
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetRequest"
      responses:
        "200":
          description: Haustier aktualisiert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetApiResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePet
      tags: [Pets]
      summary: Haustier loeschen
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Haustier geloescht.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteApiResponse"
  /api/pets/{id}/image:
    post:
      operationId: uploadPetImage
      tags: [Pets]
      summary: Haustierbild hochladen
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Bild aktualisiert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetApiResponse"
  /api/offers:
    post:
      operationId: createOffer
      tags: [Offers]
      summary: Betreuungspaket als Entwurf erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferCreateRequest"
      responses:
        "200":
          description: Angebot erstellt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/offers/{id}:
    get:
      operationId: getOffer
      tags: [Offers]
      summary: Eigenes Betreuungspaket abrufen
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Angebot gefunden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferApiResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/offers/{id}/publish:
    patch:
      operationId: publishOffer
      tags: [Offers]
      summary: Betreuungspaket veroeffentlichen
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Angebot veroeffentlicht.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferApiResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/offers/{id}/withdraw:
    patch:
      operationId: withdrawOffer
      tags: [Offers]
      summary: Betreuungspaket zurueckziehen
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Angebot zurueckgezogen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferApiResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/marketplace/hosts:
    get:
      operationId: getMarketplaceHosts
      tags: [Marketplace]
      summary: Gastgeber abrufen
      responses:
        "200":
          description: Gastgeber-Uebersicht.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostListApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/marketplace/offers:
    get:
      operationId: getMarketplaceOffers
      tags: [Marketplace]
      summary: Veroeffentlichte Betreuungspakete abrufen
      responses:
        "200":
          description: Veroeffentlichte Angebote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferListApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/marketplace/hosts/search:
    get:
      operationId: searchMarketplaceHosts
      tags: [Marketplace]
      summary: Gastgeber nach Tierart und Postleitzahl suchen
      parameters:
        - name: species
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PetChoice"
        - name: postalCode
          in: query
          required: false
          schema:
            type: string
            pattern: "^\\d{5}$"
        - name: zipCode
          in: query
          required: false
          schema:
            type: string
            pattern: "^\\d{5}$"
        - name: plz
          in: query
          required: false
          schema:
            type: string
            pattern: "^\\d{5}$"
      responses:
        "200":
          description: Gefilterte Gastgeber-Uebersicht.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostListApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/marketplace/filters:
    get:
      operationId: getMarketplaceFilters
      tags: [Marketplace]
      summary: Verfuegbare Marketplace-Filter abrufen
      responses:
        "200":
          description: Dynamisch verfuegbare Filteroptionen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceFiltersApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/chats:
    get:
      operationId: getChats
      tags: [Chats]
      summary: Eigene Chats abrufen
      responses:
        "200":
          description: Chatuebersicht.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatListApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createChat
      tags: [Chats]
      summary: Chat zu einem Angebot erstellen oder bestehenden Chat abrufen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCreateRequest"
      responses:
        "200":
          description: Chat erstellt oder gefunden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/bookings:
    get:
      operationId: getMyBookings
      tags: [Bookings]
      summary: Eigene angenommenen Buchungen abrufen
      description: Liefert alle akzeptierten Booking-Proposals, an denen der authentifizierte User als Host oder Pet Owner beteiligt ist.
      responses:
        "200":
          description: Liste angenommener Buchungen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingProposalListApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/chats/{id}/messages:
    get:
      operationId: getChatMessages
      tags: [Chats]
      summary: Nachrichten eines Chats chronologisch abrufen
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Nachrichtenliste, chronologisch von alt nach neu sortiert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessageListApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createChatMessage
      tags: [Chats]
      summary: Nachricht in einem Chat senden
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageCreateRequest"
      responses:
        "200":
          description: Nachricht erstellt und per WebSocket veroeffentlicht.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessageApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/chats/{id}/booking-proposals:
    post:
      operationId: createBookingProposal
      tags: [Chats]
      summary: Verhandelbares Buchungsangebot im Chat erstellen
      description: Erstellt eine strukturierte Buchungskarte im Chat. Alle bisherigen offenen Buchungsangebote dieses Chats werden automatisch abgelehnt.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingProposalCreateRequest"
      responses:
        "200":
          description: Buchungsangebot erstellt und als Chat-Karte veroeffentlicht.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingProposalApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/booking-proposals/{id}/accept:
    patch:
      operationId: acceptBookingProposal
      tags: [Chats]
      summary: Buchungsangebot annehmen
      description: Nur der Empfaenger des aktuellen offenen Buchungsangebots darf annehmen.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Buchungsangebot angenommen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingProposalApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/booking-proposals/{id}/decline:
    patch:
      operationId: declineBookingProposal
      tags: [Chats]
      summary: Buchungsangebot ablehnen
      description: Nur der Empfaenger des aktuellen offenen Buchungsangebots darf aktiv ablehnen.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Buchungsangebot abgelehnt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingProposalApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/booking-proposals/{id}/withdraw:
    patch:
      operationId: withdrawBookingProposal
      tags: [Chats]
      summary: Eigenes Buchungsangebot zurueckziehen
      description: Nur der Sender darf ein aktuelles offenes Buchungsangebot zurueckziehen.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Buchungsangebot zurueckgezogen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingProposalApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/messages/{id}/attachments:
    post:
      operationId: uploadMessageAttachment
      tags: [Chats]
      summary: Bildanhang zu einer Nachricht hochladen
      description: Erwartet ein Multipart-Feld `image`; erlaubt sind gueltige JPEG-, PNG-, GIF-, WebP- und BMP-Bilddateien bis 5 MB. Die Antwort enthaelt eine unter `/uploads/messages/...` abrufbare URL.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Bildanhang gespeichert und per WebSocket veroeffentlicht.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageAttachmentApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
