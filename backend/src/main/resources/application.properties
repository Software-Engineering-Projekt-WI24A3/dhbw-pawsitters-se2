# H2 Konsole aktivieren
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Datenbank
spring.datasource.url=jdbc:h2:mem:pawsitters
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# SQL-Init
spring.sql.init.mode=embedded
spring.jpa.defer-datasource-initialization=true

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT Secret (256-bit minimum, override in CI/staging via JWT_SECRET)
jwt.secret=${JWT_SECRET:dev-only-pawsitters-jwt-secret-change-me-32}
# 1 Stunde in Millisekunden
jwt.expiration=3600000

# Profile
spring.profiles.default=dev

# Actuator health endpoint for CI/CD smoke checks
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Multipart / File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Upload directory (overridable via environment)
app.upload.dir=uploads/users
