# H2 Konsole aktivieren
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Datenbank
spring.datasource.url=jdbc:h2:mem:pawsitters
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# SQL-Init
spring.sql.init.mode=embedded
spring.jpa.defer-datasource-initialization=true

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT Secret (256-bit)
jwt.secret=WdYyMCKFjvdpPIGWJpULPPNOpz82DAbgr0tprQWQqvU=
# 1 Stunde in Millisekunden
jwt.expiration=3600000

# Maximale Dateigröße für Bild-Uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Security nur im Entwicklungsprofil deaktivieren
spring.profiles.default=dev
#---
spring.config.activate.on-profile=dev
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration