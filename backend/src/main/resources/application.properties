# Datenbank
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pawsitters?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:pawsitters}
spring.datasource.password=${DB_PASSWORD:pawsitters}

# SQL-Init
spring.sql.init.mode=${DB_INIT_MODE:never}
spring.jpa.defer-datasource-initialization=true

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Secret (256-bit minimum, override in CI/staging via JWT_SECRET)
jwt.secret=${JWT_SECRET:dev-only-pawsitters-jwt-secret-change-me-32}
# 1 Stunde in Millisekunden
jwt.expiration=3600000

# Profile
spring.profiles.default=dev
server.forward-headers-strategy=framework

# CORS (for split frontend/backend deployments behind different origins)
# Production should override APP_CORS_ALLOWED_ORIGIN_PATTERNS with explicit hosts.
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://localhost:*,https://127.0.0.1:*}
app.cors.allowed-methods=${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${APP_CORS_ALLOWED_HEADERS:*}
app.cors.exposed-headers=${APP_CORS_EXPOSED_HEADERS:}
app.cors.allow-credentials=${APP_CORS_ALLOW_CREDENTIALS:true}
app.cors.max-age-seconds=${APP_CORS_MAX_AGE_SECONDS:3600}

# Actuator health endpoint for CI/CD smoke checks
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Multipart / File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Upload directory (overridable via environment)
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# Auth cookie behaviour (recommended for separate frontend/backend domains:
# auth.cookie.same-site=None plus auth.cookie.secure-mode=always)
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
auth.cookie.secure-mode=${AUTH_COOKIE_SECURE_MODE:auto}
auth.cookie.domain=${AUTH_COOKIE_DOMAIN:}
