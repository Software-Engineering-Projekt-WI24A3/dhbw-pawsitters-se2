name: Pawsitters Container Images

on:
  workflow_run:
    workflows:
      - Pawsitters CI
    types:
      - completed
    branches:
      - develop
      - main

concurrency:
  group: container-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/software-engineering-projekt-wi24a3/dhbw-pawsitters-se2-backend
  FRONTEND_IMAGE: ghcr.io/software-engineering-projekt-wi24a3/dhbw-pawsitters-se2-frontend

jobs:
  build-push-and-smoke-test:
    name: Build, push and smoke test images
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve image tags
        id: image-tags
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ref_tag="$(printf '%s' "${SOURCE_BRANCH}" | tr '[:upper:]/' '[:lower:]-' | sed 's/[^a-z0-9_.-]/-/g')"
          echo "sha-tag=sha-${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "ref-tag=${ref_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin; then
              exit 0
            fi

            sleep "$((attempt * 10))"
          done

          exit 1

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.image-tags.outputs.sha-tag }}
            ${{ env.BACKEND_IMAGE }}:${{ steps.image-tags.outputs.ref-tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            GITHUB_REF_NAME=${{ github.event.workflow_run.head_branch }}
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_SHA=${{ github.event.workflow_run.head_sha }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.image-tags.outputs.sha-tag }}
            ${{ env.FRONTEND_IMAGE }}:${{ steps.image-tags.outputs.ref-tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke test pushed images with Docker Compose
        env:
          IMAGE_TAG: ${{ steps.image-tags.outputs.sha-tag }}
          JWT_SECRET: ci-only-pawsitters-jwt-secret-change-me-123456
          MYSQL_PASSWORD: ci-pawsitters
          MYSQL_ROOT_PASSWORD: ci-pawsitters-root
        shell: bash
        run: |
          docker compose -f docker-compose.staging.yml pull
          docker compose -f docker-compose.staging.yml up -d

          healthy=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" != "1" ]; then
            docker compose -f docker-compose.staging.yml logs --tail=100
            exit 1
          fi

          frontend_ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/ > /dev/null; then
              frontend_ready=1
              break
            fi
            sleep 2
          done

          if [ "$frontend_ready" != "1" ]; then
            docker compose -f docker-compose.staging.yml logs --tail=100
            exit 1
          fi

      - name: Stop smoke-test stack
        if: always()
        env:
          IMAGE_TAG: ${{ steps.image-tags.outputs.sha-tag }}
          JWT_SECRET: ci-only-pawsitters-jwt-secret-change-me-123456
          MYSQL_PASSWORD: ci-pawsitters
          MYSQL_ROOT_PASSWORD: ci-pawsitters-root
        run: docker compose -f docker-compose.staging.yml down -v --remove-orphans
