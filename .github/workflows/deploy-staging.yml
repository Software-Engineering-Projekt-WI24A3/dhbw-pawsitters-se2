name: Pawsitters Staging Deploy

on:
  workflow_run:
    workflows:
      - Pawsitters Container Images
    types:
      - completed
    branches:
      - develop
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy, for example develop or sha-<commit-sha>.
        required: false
        default: develop

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy staging stack
    runs-on: ubuntu-latest
    environment: staging
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve deployment tag
        id: deployment
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            image_tag="sha-${WORKFLOW_RUN_SHA}"
            deployed_sha="${WORKFLOW_RUN_SHA}"
          else
            image_tag="${MANUAL_IMAGE_TAG:-develop}"
            deployed_sha="${image_tag#sha-}"
          fi

          echo "image-tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "deployed-sha=${deployed_sha}" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH credentials
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        shell: bash
        run: |
          : "${STAGING_HOST:?Set STAGING_HOST in the staging environment}"
          : "${STAGING_SSH_KEY:?Set STAGING_SSH_KEY in the staging environment}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts

      - name: Upload Compose configuration
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        shell: bash
        run: |
          : "${STAGING_USER:?Set STAGING_USER in the staging environment}"
          ssh -i ~/.ssh/staging_key "$STAGING_USER@$STAGING_HOST" 'mkdir -p ~/pawsitters'
          scp -i ~/.ssh/staging_key docker-compose.staging.yml "$STAGING_USER@$STAGING_HOST:~/pawsitters/docker-compose.yml"
          scp -i ~/.ssh/staging_key backend/src/main/resources/data.sql "$STAGING_USER@$STAGING_HOST:~/pawsitters/data.sql"

      - name: Deploy stack
        env:
          IMAGE_TAG: ${{ steps.deployment.outputs.image-tag }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        shell: bash
        run: |
          : "${JWT_SECRET:?Set JWT_SECRET in the staging environment}"
          : "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the staging environment}"
          : "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the staging environment}"

          write_env_var() {
            local name="$1"
            local value="$2"

            if [[ "$value" == *"'"* ]]; then
              printf 'Secret %s contains a single quote, which is not supported by the staging env writer.\n' "$name" >&2
              exit 1
            fi

            printf "%s='%s'\n" "$name" "$value"
          }

          {
            write_env_var IMAGE_TAG "$IMAGE_TAG"
            write_env_var JWT_SECRET "$JWT_SECRET"
            write_env_var MYSQL_PASSWORD "$MYSQL_PASSWORD"
            write_env_var MYSQL_ROOT_PASSWORD "$MYSQL_ROOT_PASSWORD"
            write_env_var GHCR_USERNAME "$GHCR_USERNAME"
            write_env_var GHCR_TOKEN "$GHCR_TOKEN"
          } > staging.env

          scp -i ~/.ssh/staging_key staging.env "$STAGING_USER@$STAGING_HOST:~/pawsitters/.env"

          ssh -i ~/.ssh/staging_key "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          cd ~/pawsitters
          set -a
          . ./.env
          set +a

          sync_mysql_credentials() {
            local mysql_container current_root_password root_password_for_login
            local app_user_b64 app_password_b64 database_name root_password_b64

            mysql_container="$(docker compose -f docker-compose.yml ps -q mysql 2>/dev/null || true)"
            if [ -z "$mysql_container" ]; then
              return 0
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' "$mysql_container" 2>/dev/null || true)" != "true" ]; then
              return 0
            fi

            current_root_password="$(docker exec "$mysql_container" printenv MYSQL_ROOT_PASSWORD 2>/dev/null || true)"
            for root_password_candidate in "$current_root_password" "$MYSQL_ROOT_PASSWORD"; do
              if [ -z "$root_password_candidate" ]; then
                continue
              fi

              if docker exec -e MYSQL_PWD="$root_password_candidate" "$mysql_container" mysql -uroot -e 'SELECT 1' >/dev/null 2>&1; then
                root_password_for_login="$root_password_candidate"
                break
              fi
            done

            if [ -z "${root_password_for_login:-}" ]; then
              printf 'Existing MySQL container is running, but root login failed; cannot reconcile staging credentials.\n' >&2
              exit 1
            fi

            printf 'Reconciling existing MySQL credentials with current staging secrets.\n'
            app_user_b64="$(printf '%s' "${MYSQL_USER:-pawsitters}" | base64 | tr -d '\n')"
            app_password_b64="$(printf '%s' "$MYSQL_PASSWORD" | base64 | tr -d '\n')"
            database_name="${MYSQL_DATABASE:-pawsitters}"
            if [[ ! "$database_name" =~ ^[A-Za-z0-9_]+$ ]]; then
              printf 'MYSQL_DATABASE contains unsupported characters for automatic staging credential recovery.\n' >&2
              exit 1
            fi
            root_password_b64="$(printf '%s' "$MYSQL_ROOT_PASSWORD" | base64 | tr -d '\n')"

            docker exec -e MYSQL_PWD="$root_password_for_login" -i "$mysql_container" mysql -uroot <<SQL
          SET @app_user = FROM_BASE64('${app_user_b64}');
          SET @app_password = FROM_BASE64('${app_password_b64}');
          SET @root_password = FROM_BASE64('${root_password_b64}');
          SET @quoted_app_user = QUOTE(@app_user);
          SET @quoted_app_password = QUOTE(@app_password);
          SET @quoted_root_password = QUOTE(@root_password);
          SET @app_account = CONCAT(@quoted_app_user, "@'%'");
          SET @sql = 'CREATE DATABASE IF NOT EXISTS ${database_name}';
          PREPARE stmt FROM @sql;
          EXECUTE stmt;
          DEALLOCATE PREPARE stmt;
          SET @sql = CONCAT('CREATE USER IF NOT EXISTS ', @app_account, ' IDENTIFIED BY ', @quoted_app_password);
          PREPARE stmt FROM @sql;
          EXECUTE stmt;
          DEALLOCATE PREPARE stmt;
          SET @sql = CONCAT('ALTER USER ', @app_account, ' IDENTIFIED BY ', @quoted_app_password);
          PREPARE stmt FROM @sql;
          EXECUTE stmt;
          DEALLOCATE PREPARE stmt;
          SET @sql = CONCAT('GRANT ALL PRIVILEGES ON ${database_name}.* TO ', @app_account);
          PREPARE stmt FROM @sql;
          EXECUTE stmt;
          DEALLOCATE PREPARE stmt;
          SET @sql = CONCAT("ALTER USER IF EXISTS 'root'@'localhost' IDENTIFIED BY ", @quoted_root_password);
          PREPARE stmt FROM @sql;
          EXECUTE stmt;
          DEALLOCATE PREPARE stmt;
          SET @sql = CONCAT("ALTER USER IF EXISTS 'root'@'%' IDENTIFIED BY ", @quoted_root_password);
          PREPARE stmt FROM @sql;
          EXECUTE stmt;
          DEALLOCATE PREPARE stmt;
          FLUSH PRIVILEGES;
          SQL
          }

          sync_mysql_credentials

          if [ -n "${GHCR_TOKEN:-}" ] && [ -n "${GHCR_USERNAME:-}" ]; then
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          fi

          docker compose -f docker-compose.yml pull
          if ! docker compose -f docker-compose.yml up -d --remove-orphans; then
            docker compose -f docker-compose.yml ps
            docker compose -f docker-compose.yml logs --tail=100 mysql backend
            exit 1
          fi

          healthy=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" != "1" ]; then
            docker compose -f docker-compose.yml ps
            docker compose -f docker-compose.yml logs --tail=100 mysql backend
            exit 1
          fi

          frontend_ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/ > /dev/null; then
              frontend_ready=1
              break
            fi
            sleep 2
          done

          if [ "$frontend_ready" != "1" ]; then
            docker compose -f docker-compose.yml ps
            docker compose -f docker-compose.yml logs --tail=100 frontend backend
            exit 1
          fi
          REMOTE

      - name: Summarize deployment
        run: |
          echo "Deployed image tag: ${{ steps.deployment.outputs.image-tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed SHA: ${{ steps.deployment.outputs.deployed-sha }}" >> "$GITHUB_STEP_SUMMARY"
